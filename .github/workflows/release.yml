name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: sh tests/installers/verify-install-sh.sh
      - run: pwsh -NoProfile -File tests/installers/verify-install-ps1.ps1
      - run: pwsh -NoProfile -File tests/release/verify-assets.ps1 -SelfTest
      - run: sh tests/release/verify-assets.sh --self-test
      - name: Require tag and Cargo versions to match
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"

  build-windows:
    needs: validate-and-test
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          $actual = & ./target/x86_64-pc-windows-msvc/release/llm-wikis.exe --version
          if ($actual -ne 'llm-wikis 0.1.0') { throw "Unexpected version: $actual" }
      - shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null; Copy-Item target/x86_64-pc-windows-msvc/release/llm-wikis.exe dist/llm-wikis-windows-amd64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binary
          path: dist/llm-wikis-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    needs: validate-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: test "$(./target/x86_64-unknown-linux-musl/release/llm-wikis --version)" = 'llm-wikis 0.1.0'
      - run: mkdir -p dist && cp target/x86_64-unknown-linux-musl/release/llm-wikis dist/llm-wikis-linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-binary
          path: dist/llm-wikis-linux-amd64
          if-no-files-found: error

  build-macos:
    needs: validate-and-test
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: test "$(./target/aarch64-apple-darwin/release/llm-wikis --version)" = 'llm-wikis 0.1.0'
      - run: mkdir -p dist && cp target/aarch64-apple-darwin/release/llm-wikis dist/llm-wikis-darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-binary
          path: dist/llm-wikis-darwin-arm64
          if-no-files-found: error

  assemble:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-binary'
          path: artifacts
          merge-multiple: true
      - name: Stage checksum-only bundle
        shell: bash
        run: |
          mkdir release-bundle
          cp artifacts/llm-wikis-windows-amd64.exe release-bundle/
          cp artifacts/llm-wikis-linux-amd64 release-bundle/
          cp artifacts/llm-wikis-darwin-arm64 release-bundle/
          (cd release-bundle && sha256sum llm-wikis-windows-amd64.exe llm-wikis-linux-amd64 llm-wikis-darwin-arm64 > SHA256SUMS)
      - run: pwsh -NoProfile -File tests/release/verify-assets.ps1 -StagingDirectory release-bundle
      - run: sh tests/release/verify-assets.sh release-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release-bundle
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release-bundle
      - run: pwsh -NoProfile -File tests/release/verify-assets.ps1 -StagingDirectory release-bundle
      - run: sh tests/release/verify-assets.sh release-bundle
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release-bundle/llm-wikis-windows-amd64.exe
            release-bundle/llm-wikis-linux-amd64
            release-bundle/llm-wikis-darwin-arm64
            release-bundle/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes release-bundle/llm-wikis-windows-amd64.exe release-bundle/llm-wikis-linux-amd64 release-bundle/llm-wikis-darwin-arm64 release-bundle/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
