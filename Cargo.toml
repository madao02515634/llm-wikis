[package]
name = "llm-wikis"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
indicatif = { version = "0.18.6", features = ["in_memory"] }

